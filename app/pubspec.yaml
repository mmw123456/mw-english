name: mw_english
description: "MW English — 离线背单词 App"
publish_to: 'none'

version: 0.14.0+31

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  # 本地库：词库与学习记录都在 SQLite，全程离线
  sqflite: ^2.4.6
  path: ^1.9.0
  archive: ^4.7.1
  xml: ^7.1.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  # 只有「生成文章」这一处联网：调 DeepSeek。学习数据全本地。
  http: ^1.5.0
  # DeepSeek Key 加密存（Android Keystore），不许明文落 shared_preferences
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 全量字体：Noto Sans CJK SC 官方 OTF，44,810 字符（CJK 20,976）。
  # 不用子集，避免生僻字缺字；体积约 32 MB，用户确认可接受。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700

  assets:
    - assets/db/
    # 近义词数据：首次启动灌进 synonyms 表（814 词，其余 6 词无近义词）
    - assets/data/

  # 真折射（v0.7.1）：玻璃边缘位移 + 中心放大 4.5% + 6% 色散。
  # 加载失败时 GlassSurface 静默回落到 v0.7.0 的近似玻璃。
  shaders:
    - shaders/liquid_glass.frag
