org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 用 JDK 21 编译：本机 JAVA_HOME 是 JDK 25，AGP 9 支持 17/21，25 不在支持范围
org.gradle.java.home=D\:\\Develop\\JDK21
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 项目路径现已全英文，overridePathCheck 保留作保险（历史上中文路径会触发 AGP 拒绝构建）
android.overridePathCheck=true
# 插件模块（file_selector 等）首次编译 Kotlin 时，增量缓存关不掉：
#   Could not close incremental caches in ...\cacheable\caches-jvm\jvm\kotlin
# 报这个错是编译器的缓存收尾失败，不是代码问题。关掉增量编译最省事。
kotlin.incremental=false
